<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alcon Brain Map</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .meta { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
  .warn { background: #451a03; border: 1px solid #f59e0b; padding: 8px; border-radius: 8px; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .col { background: #111c34; border: 1px solid #22304d; border-radius: 10px; padding: 8px; min-height: 120px; }
  .node { border-radius: 8px; padding: 6px; margin: 6px 0; font-size: 12px; background: #1e293b; }
.ok { border-left: 6px solid #22c55e; }
.bad { border-left: 6px solid #ef4444; }
.na { border-left: 6px solid #64748b; }
.mid { border-left: 6px solid #f59e0b; }
  table { width: 100%; font-size: 12px; border-collapse: collapse; margin-top: 12px; }
  td, th { border: 1px solid #22304d; padding: 4px 6px; text-align: left; }
</style>
</head>
<body>
<h1>Alcon Brain Map</h1>
<div class="meta" id="meta">cargando…</div>
<div id="warn"></div>
<div id="radar-card"></div>
<div class="grid">
  <div class="col" id="col-services"><h3>Servicios</h3></div>
  <div class="col" id="col-squads"><h3>Squads</h3></div>
  <div class="col" id="col-devices"><h3>Devices</h3></div>
</div>
<table><tbody id="health"></tbody></table>
<!--ALCON-GRAPH:START-->
<script type="application/json" id="alcon-graph">{"nodes":[{"id":"svc:forja-router","file":"server/lib/granja.json","role":"infra","lines":26},{"id":"svc:alcon-api","file":"server/server.js","role":"api","lines":140},{"id":"svc:alcon-pwa","file":"pwa/src/App.tsx","role":"ui","lines":215},{"id":"svc:go-orchestrator","file":"server/go/orchestrator.go","role":"orchestrator","lines":568},{"id":"device:debian","file":"server/lib/granja.json","role":"device:arquitectura","lines":26},{"id":"device:kali","file":"server/lib/granja.json","role":"device:performance","lines":26},{"id":"device:vps","file":"server/lib/granja.json","role":"device:seguridad","lines":26},{"id":"device:cel","file":"server/lib/granja.json","role":"device:edge","lines":26},{"id":"device:montar-forja","file":"server/lib/granja.json","role":"device:taller-modelos","lines":26},{"id":"squad:quick-review","file":"server/lib/granja.json","role":"squad","lines":26},{"id":"squad:code-audit","file":"server/lib/granja.json","role":"squad","lines":26},{"id":"squad:research-deep","file":"server/lib/granja.json","role":"squad","lines":26},{"id":"squad:duelo","file":"server/lib/granja.json","role":"squad","lines":26},{"id":"squad:dose-audit","file":"server/lib/granja.json","role":"squad","lines":26},{"id":"agent:radar","file":"server/config/agents.js","role":"agent:last_fetch=unknown count=?","lines":2}],"edges":[{"from":"svc:alcon-api","to":"svc:forja-router","type":"call"},{"from":"svc:go-orchestrator","to":"svc:forja-router","type":"call"},{"from":"svc:alcon-pwa","to":"svc:alcon-api","type":"http","via":"pwa/src/lib/api.ts: POST /api/task, GET /api/tasks, POST /api/task/:id/claim, POST /api/task/:id/heartbeat"},{"from":"svc:alcon-pwa","to":"svc:alcon-api","type":"socket","via":":3003"},{"from":"svc:alcon-api","to":"squad:quick-review","type":"orchestrate"},{"from":"squad:quick-review","to":"device:debian","type":"fanout"},{"from":"device:debian","to":"svc:forja-router","type":"call"},{"from":"svc:alcon-api","to":"squad:code-audit","type":"orchestrate"},{"from":"squad:code-audit","to":"device:debian","type":"fanout"},{"from":"device:debian","to":"svc:forja-router","type":"call"},{"from":"squad:code-audit","to":"device:kali","type":"fanout"},{"from":"device:kali","to":"svc:forja-router","type":"call"},{"from":"squad:code-audit","to":"device:vps","type":"fanout"},{"from":"device:vps","to":"svc:forja-router","type":"call"},{"from":"squad:code-audit","to":"device:cel","type":"fanout"},{"from":"device:cel","to":"svc:forja-router","type":"call"},{"from":"svc:alcon-api","to":"squad:research-deep","type":"orchestrate"},{"from":"squad:research-deep","to":"device:debian","type":"fanout"},{"from":"device:debian","to":"svc:forja-router","type":"call"},{"from":"svc:alcon-api","to":"squad:duelo","type":"orchestrate"},{"from":"squad:duelo","to":"device:debian","type":"fanout"},{"from":"device:debian","to":"svc:forja-router","type":"call"},{"from":"squad:duelo","to":"device:kali","type":"fanout"},{"from":"device:kali","to":"svc:forja-router","type":"call"},{"from":"squad:duelo","to":"device:vps","type":"fanout"},{"from":"device:vps","to":"svc:forja-router","type":"call"},{"from":"squad:duelo","to":"device:cel","type":"fanout"},{"from":"device:cel","to":"svc:forja-router","type":"call"},{"from":"squad:duelo","to":"device:montar-forja","type":"fanout"},{"from":"device:montar-forja","to":"svc:forja-router","type":"call"},{"from":"svc:alcon-api","to":"squad:dose-audit","type":"orchestrate"},{"from":"squad:dose-audit","to":"device:debian","type":"fanout"},{"from":"device:debian","to":"svc:forja-router","type":"call"},{"from":"squad:dose-audit","to":"device:kali","type":"fanout"},{"from":"device:kali","to":"svc:forja-router","type":"call"},{"from":"squad:dose-audit","to":"device:vps","type":"fanout"},{"from":"device:vps","to":"svc:forja-router","type":"call"},{"from":"squad:dose-audit","to":"device:cel","type":"fanout"},{"from":"device:cel","to":"svc:forja-router","type":"call"},{"from":"svc:alcon-api","to":"agent:radar","type":"listener"}]}</script>

<script>
const API_CANDIDATES = ['/api/health-map', 'http://100.102.63.30:3003/api/health-map'];
const HEALTH_KEY = {
  'svc:forja-router': 'router',
  'svc:alcon-api': 'api',
  'svc:alcon-pwa': 'pwa',
  'svc:go-orchestrator': 'go'
};

async function loadGraph() {
  const embedded = document.querySelector('#alcon-graph');
  if (embedded) return JSON.parse(embedded.textContent);
  const res = await fetch('./alcon-graph.json');
  return await res.json();
}

async function loadHealth() {
  for (const url of API_CANDIDATES) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (res.ok) return { data: await res.json(), url };
    } catch {}
  }
  return { data: null, url: null };
}

async function loadRadar(base) {
  const urls = [`${base}/api/radar-status`, 'http://100.102.63.30:3003/api/radar-status'];
  for (const url of urls) {
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (res.ok) return await res.json();
    } catch {}
  }
  return null;
}

function radarAge(lastFetch) {
  if (!lastFetch) return null;
  return Math.floor((Date.now() - new Date(lastFetch).getTime()) / 60000);
}

function paintRadar(r) {
  const age = r ? radarAge(r.last_fetch) : null;
  const cls = age === null || age > 360 ? 'bad' : age > 60 ? 'mid' : 'ok';
  const label = age === null
    ? 'sin cacerías registradas (unknown)'
    : `última cacería: hace ${age < 60 ? age + 'm' : Math.floor(age / 60) + 'h'} — ${r.count ?? '?'} hallazgos de ${r.source || '?'}`;
  document.getElementById('radar-card').innerHTML =
    `<div class="node ${cls}"><b>📡 radar</b> · ${label}</div>`;
}

function statusClass(key, health) {
  if (!health || !health[key]) return 'na';
  const value = health[key].ok;
  if (value === true) return 'ok';
  if (value === false) return 'bad';
  return 'na';
}

async function render() {
  const graph = await loadGraph().catch(() => ({ nodes: [], edges: [] }));
  const { data: health, url } = await loadHealth();
  const base = url && url.startsWith('http') ? new URL(url).origin : location.origin;
  paintRadar(await loadRadar(base));
  document.getElementById('meta').textContent = `nodos=${graph.nodes.length} aristas=${graph.edges.length} health=${url || 'sin conexión'} ts=${health?.timestamp || '-'}`;

  const services = graph.nodes.filter(n => n.id.startsWith('svc:'));
  const squads = graph.nodes.filter(n => n.id.startsWith('squad:'));
  const devices = graph.nodes.filter(n => n.id.startsWith('device:'));
  const shown = [...services, ...squads.slice(0, 5), ...devices].slice(0, 12);
  document.getElementById('warn').innerHTML = graph.nodes.length > 12
    ? `<div class="warn">Mostrando 12 de ${graph.nodes.length} nodos por legibilidad.</div>` : '';

  const paint = (list, el) => {
    document.getElementById(el).innerHTML = `<h3>${document.getElementById(el).querySelector('h3').textContent}</h3>` + list.map(n => {
      const cls = n.id.startsWith('svc:') ? statusClass(HEALTH_KEY[n.id], health) : 'na';
      return `<div class="node ${cls}"><b>${n.id}</b><br>${n.file} · ${n.lines} líneas</div>`;
    }).join('');
  };
  paint(services, 'col-services');
  paint(squads.slice(0, 5), 'col-squads');
  paint(shown.filter(n => n.id.startsWith('device:')), 'col-devices');

  const rows = [['router', 'forja-router'], ['api', 'alcon-api'], ['pwa', 'alcon-pwa'], ['go', 'go-orchestrator']]
    .map(([key, label]) => {
      const h = health?.[key] || {};
      const ok = h.ok === true ? 'verde' : h.ok === false ? 'rojo' : 'gris';
      return `<tr><td>${label}</td><td>${ok}</td><td>${h.host || '-'}</td><td>${h.ms ?? '-'}</td></tr>`;
    }).join('');
  document.getElementById('health').innerHTML = `<tr><th>pieza</th><th>estado</th><th>host</th><th>ms</th></tr>${rows}`;
}

render();
setInterval(render, 30000);
</script>
</body>
</html>
